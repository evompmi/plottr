name: Build & Deploy to GitHub Pages

on:
  # Deploy only after the Tests workflow completes successfully on a push to
  # main/master, so a commit that fails lint / format / typecheck / boundaries /
  # SRI / the full test suite / the compiled-sources-in-sync check / e2e never
  # reaches Pages. Previously this workflow triggered on `push` independently of
  # Tests, so the two raced — a push that broke a gate still deployed because
  # deploy only needed `npm run build` to exit 0.
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

# The build only reads the repo. The deploy job alone is granted `pages` and
# `id-token`, and it runs none of the repo's code.
permissions:
  contents: read

# A second Pages deployment fails while one is running, so queue them.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    # workflow_run fires on both success and failure — gate on success.
    # Tests also runs on pull requests, and the `branches` filter above matches
    # the triggering run's head branch *name*, which a fork chooses: a fork PR
    # from its own `master` would pass it. So also require that Tests ran on a
    # push to this repository — never deploy a fork's commit.
    # A manual workflow_dispatch run has no workflow_run payload, so allow it
    # unconditionally (use it to force a redeploy).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to full commit SHAs (tag in the trailing comment):
      # what they produce goes live, and a moved tag would run new code here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Don't leave a token in .git/config for the npm scripts to read.
          persist-credentials: false
          # Check out the exact commit Tests passed on (workflow_run), or the
          # dispatched ref — never a newer, untested tip of the branch.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # The Pages upload ignores .gitignore, so pointing it at the repo root
      # would publish node_modules. Copy only tracked files and build outputs
      # that aren't ignored. The copy lives outside the repo so it can't list
      # itself.
      - name: Collect site files
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/site"
          git ls-files -co --exclude-standard -z |
            tar --null -T - -cf - |
            tar -xf - -C "$RUNNER_TEMP/site"

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
